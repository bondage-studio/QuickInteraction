name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test modular source and translations
        run: npm test

      - name: Build self-contained main.js (bcModSdk + 业务逻辑)
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp assets/main.js _site/assets/main.js
          cp assets/version.json _site/version.json
          cp assets/version.json _site/assets/version.json
          cp loader.user.js _site/loader.user.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
